<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>記帳小工具</title>
  <meta name="theme-color" content="#173f38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="記帳小工具">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>記帳小工具</h1>

    <section id="authPanel" class="card auth-card" aria-labelledby="authTitle">
      <div class="auth-heading">
        <h2 id="authTitle">登入帳號</h2>
        <img class="mascot mascot-login" src="./images/penguin.jpg" alt="" aria-hidden="true">
      </div>
      <form id="loginForm">
        <div class="auth-fields">
          <label>Email<input type="email" id="email" autocomplete="username" required></label>
          <label>密碼<input type="password" id="password" autocomplete="current-password" required></label>
        </div>
        <button class="add" id="login" type="submit">登入</button>
      </form>
      <p id="authMsg" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="appPanel" hidden>
      <div class="accountbar">
        <span>已登入：<b id="accountEmail"></b></span>
        <button id="logout" class="secondary" type="button">登出</button>
      </div>

      <p id="dataMsg" class="status" role="status" aria-live="polite"></p>
      <div class="month"><label for="m" style="margin:0">月份</label><input type="month" id="m"></div>
      <section class="balance" aria-live="polite">
        <div class="balance-content">
          <small>本月結餘</small><div class="big" id="bal">$0</div>
          <div class="row2"><div><small>收入</small><b id="sin">$0</b></div><div><small>支出</small><b id="sout">$0</b></div></div>
        </div>
        <img class="mascot mascot-balance" src="./images/penguin.jpg" alt="" aria-hidden="true">
      </section>

      <section id="budgetCard" class="card budget-card" aria-labelledby="budgetTitle">
        <h2 id="budgetTitle">每月預算</h2>
        <div id="budgetContent" aria-live="polite"></div>
      </section>

      <div class="card">
        <div class="entry-heading">
          <h2>記下今天的收支</h2>
          <img class="mascot mascot-pencil" src="./images/penguin.jpg" alt="" aria-hidden="true">
        </div>
        <div class="seg" role="group" aria-label="類型">
          <button type="button" id="tOut" aria-pressed="true">支出</button>
          <button type="button" id="tIn" aria-pressed="false">收入</button>
        </div>
        <div class="grid">
          <label>金額<input type="number" id="amt" inputmode="decimal" min="0" step="any" placeholder="例如 120"></label>
          <label>分類<select id="cat"></select></label>
          <label>日期
            <span class="date-control">
              <span class="date-control-display" aria-hidden="true">
                <span id="dateDisplay"></span>
                <svg class="date-control-icon" viewBox="0 0 24 24" fill="none">
                  <rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                  <path d="M7.5 3.5v3M16.5 3.5v3M4 9.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                </svg>
              </span>
              <input type="date" id="date">
            </span>
          </label>
          <label>備註<input type="text" id="note" placeholder="選填，例如 午餐"></label>
        </div>
        <button class="add" id="add" type="button">新增一筆</button>
        <div id="msg" class="empty" style="padding:8px 0 0;color:var(--out)" role="status" aria-live="polite"></div>
      </div>

      <h2>分類統計（支出）</h2>
      <div id="cats"></div>
      <section class="card monthly-report" aria-labelledby="monthlyReportTitle">
        <div class="monthly-report-heading">
          <h2 id="monthlyReportTitle">月報</h2>
          <img class="mascot monthly-report-mascot" src="./images/penguin.jpg" alt="" aria-hidden="true">
        </div>
        <div id="monthlyReportContent" aria-live="polite"></div>
      </section>
      <h2>明細</h2>
      <div class="card" style="margin-top:0"><ul id="list"></ul></div>
    </section>
  </main>
</body>
</html>
